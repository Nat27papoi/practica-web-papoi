<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Práctica web — Informática III</title>
  </head>
  <body class="bg-gray-100 text-gray-800">
    <header class="bg-blue-600 text-white text-center p-4 font-semibold">
      <h1>
        Rocker Burguer
      </h1>
      <br>
      <p>Ricas, deliciosas y exquisitas hamburguesas</p>

    </header>
    <main>
      <!-- Botones de categoría arriba del catálogo -->
<div id="filtros" class="flex gap-2 mb-6 flex-wrap">
  <button 
    data-categoria="Todos" 
    class="btn-filtro bg-blue-500 text-white font-semibold py-2 px-4 rounded shadow transition">
    Todos
  </button>
  <button 
    data-categoria="Postres" 
    class="btn-filtro bg-white text-gray-700 hover:bg-gray-100 font-semibold py-2 px-4 rounded shadow transition">
    Postres
  </button>
  <button 
    data-categoria="Bebidas" 
    class="btn-filtro bg-white text-gray-700 hover:bg-gray-100 font-semibold py-2 px-4 rounded shadow transition">
    Bebidas
  </button>
  <button 
    data-categoria="Comida" 
    class="btn-filtro bg-white text-gray-700 hover:bg-gray-100 font-semibold py-2 px-4 rounded shadow transition">
    Comida
  </button>
</div>
      <div id="catalogo" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
      
    </div>
   <aside class="bg-white rounded-lg shadow p-6 w-full md:w-80 h-fit">
  <h2 class="text-2xl font-bold text-gray-800 mb-4">Mi pedido</h2>
  
  <!-- Lista de productos agregados -->
  <ul id="lista-pedido" class="space-y-2 mb-4"></ul>
  
  <!-- Total -->
  <p id="total" class="text-lg font-bold text-gray-800 border-t pt-2 mb-4">Total: $0.00 USD</p>
  
  <!-- Botón Vaciar pedido -->
  <button 
    id="btn-vaciar" 
    class="w-full bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded transition">
    Vaciar pedido
  </button>
</aside>
    </main>
    <footer>

    </footer>

</html>
